name: Deploy to WordPress.org

# Publishing a GitHub release is the single trigger: the release tag is the
# version of record, and the job refuses to run if the tag and the version
# baked into the plugin disagree.
#
# Requires two repository secrets holding WordPress.org credentials:
#   SVN_USERNAME, SVN_PASSWORD
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            publish:
                description: 'Actually push to the WordPress.org SVN repository'
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest

        steps:
            - name: Check out the plugin
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify the version agrees everywhere
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail

                  pkg=$(node -p "require('./package.json').version")
                  header=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' simple-nws-weather-block.php)
                  constant=$(sed -n "s/.*SIMPLE_NWS_WEATHER_BLOCK_VERSION'[[:space:]]*,[[:space:]]*'\([^']*\)'.*/\1/p" simple-nws-weather-block.php)
                  block=$(node -p "require('./src/weather/block.json').version")
                  stable=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | tr -d '\r')

                  echo "package.json      $pkg"
                  echo "plugin header     $header"
                  echo "version constant  $constant"
                  echo "block.json        $block"
                  echo "readme stable tag $stable"

                  fail=0
                  for pair in "plugin header:$header" "version constant:$constant" "block.json:$block" "readme stable tag:$stable"; do
                    name=${pair%%:*}
                    value=${pair#*:}
                    if [ "$value" != "$pkg" ]; then
                      echo "::error::$name is $value but package.json says $pkg"
                      fail=1
                    fi
                  done

                  # A release tag may or may not carry a leading `v`; both are fine so
                  # long as the number underneath matches.
                  if [ -n "${RELEASE_TAG:-}" ] && [ "${RELEASE_TAG#v}" != "$pkg" ]; then
                    echo "::error::release tag $RELEASE_TAG does not match version $pkg"
                    fail=1
                  fi

                  [ "$fail" -eq 0 ] || {
                    echo "Run \`npm run version:set -- $pkg\` and commit the result."
                    exit 1
                  }

            - name: Verify readme.txt is current
              run: npm run readme:check

            - name: Build
              run: npm run build

            - name: Deploy to WordPress.org
              id: deploy
              if: github.event_name == 'release' || inputs.publish
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: simple-nws-weather-block

            - name: Attach the zip to the GitHub release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "${{ steps.deploy.outputs.zip-path }}" --clobber
